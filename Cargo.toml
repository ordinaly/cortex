[workspace]
members = [
    "crates/cortex-articulation",
    "crates/cortex-core",
    "crates/cortex-graph",
    "crates/cortex-memory",
    "crates/cortex-runtime",
    "crates/cortex-python",
]
resolver = "2"

[workspace.package]
version = "1.0.0-rc1"
edition = "2024"
rust-version = "1.85"
authors = ["Arnold von Bauer-Gauss"]
license = "Apache-2.0"
repository = "https://github.com/ordinaly/cortex"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.29", features = ["extension-module"] }
