name: normalize-runtime-once

on:
  push:
    branches:
      - feature/native-full-runtime

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-full-runtime
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit canonical runtime metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "Normalize full runtime Rust and lockfile [runtime-normalized]"
          git push origin HEAD:feature/native-full-runtime
