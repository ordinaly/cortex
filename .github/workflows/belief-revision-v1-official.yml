name: cortex-belief-revision-v1-official

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/belief_revision*.py"
      - "tests/test_belief_revision.py"
      - "docs/BELIEF_REVISION_V1_PROTOCOL.md"
      - ".github/workflows/belief-revision-v1-official.yml"

jobs:
  official:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run frozen belief revision v1 campaign
        run: >-
          python research/belief_revision_campaign.py
          --output belief-revision-v1.jsonl
      - name: Enforce frozen belief revision v1 gates
        run: >-
          python research/belief_revision_gate.py
          belief-revision-v1.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cortex-belief-revision-v1
          path: belief-revision-v1.jsonl
