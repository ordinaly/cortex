name: cortex-belief-revision-preflight

on:
  pull_request:
    paths:
      - "research/belief_revision*.py"
      - "tests/test_belief_revision.py"
      - "docs/BELIEF_REVISION_V1_PROTOCOL.md"
      - ".github/workflows/belief-revision-preflight.yml"

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - name: Belief revision preflight
        run: pytest tests/test_belief_revision.py -q
