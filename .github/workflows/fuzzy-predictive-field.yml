name: cortex-fuzzy-predictive-field

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/fuzzy_predictive_field.py"
      - "research/fuzzy_predictive_field_campaign.py"
      - "tests/test_fuzzy_predictive_field.py"
      - "tests/test_fuzzy_predictive_field_campaign.py"
      - "research/adaptive_predictive_distinction.py"
      - "tests/test_adaptive_predictive_distinction.py"
      - "docs/FUZZY_PREDICTIVE_FIELD_V1.md"
      - ".github/workflows/fuzzy-predictive-field.yml"

jobs:
  fuzzy-predictive-field:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest
      - run: >-
          pytest
          tests/test_fuzzy_predictive_field.py
          tests/test_fuzzy_predictive_field_campaign.py
          tests/test_adaptive_predictive_distinction.py
          -q
      - name: Run fuzzy predictive field campaign
        run: >-
          python research/fuzzy_predictive_field_campaign.py
          --seeds 20
          --output fuzzy-predictive-field-v1.jsonl
      - name: Run adaptive predictive-distinction campaign
        run: >-
          python research/adaptive_predictive_distinction.py
          --seeds 20
          --output adaptive-predictive-distinction-v1.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-fuzzy-predictive-field-v1
          path: |
            fuzzy-predictive-field-v1.jsonl
            adaptive-predictive-distinction-v1.jsonl
