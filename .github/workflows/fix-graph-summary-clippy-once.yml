name: fix-graph-summary-clippy-once

on:
  push:
    branches:
      - perf/lightweight-graph-summary

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/lightweight-graph-summary
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Apply strict-Clippy test initializer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/cortex-graph/src/lib.rs')
          s = p.read_text()
          old = '''        let mut cfg = EvidenceConfig::default();
        cfg.relation_min_exposure = 1;
        cfg.relation_active_threshold = 0.75;
        cfg.relation_absent_threshold = 0.25;
        let mut g = SparseEvidenceGraph::new(cfg).unwrap();
'''
          new = '''        let cfg = EvidenceConfig {
            relation_min_exposure: 1,
            relation_active_threshold: 0.75,
            relation_absent_threshold: 0.25,
            ..Default::default()
        };
        let mut g = SparseEvidenceGraph::new(cfg).unwrap();
'''
          if old not in s:
              raise SystemExit('target initializer not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Commit lint fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/cortex-graph/src/lib.rs
          git commit -m "Satisfy strict Clippy in graph summary test"
          git push origin HEAD:perf/lightweight-graph-summary
