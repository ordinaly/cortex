name: cortex-support-sparse-prediction

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/support_sparse_prediction.py"
      - "research/support_sparse_prediction_campaign.py"
      - "research/support_sparse_prediction_gate.py"
      - "tests/test_support_sparse_prediction.py"
      - "docs/SUPPORT_SPARSE_PREDICTION_V1.md"
      - ".github/workflows/support-sparse-prediction.yml"

jobs:
  support-sparse-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest
      - name: Unit and differential tests
        run: pytest tests/test_support_sparse_prediction.py -q
      - name: Run support-sparse campaign
        run: >-
          python research/support_sparse_prediction_campaign.py
          --seeds 3
          --output support-sparse-prediction-v1.jsonl
      - name: Validate campaign and report hypotheses
        run: >-
          python research/support_sparse_prediction_gate.py
          support-sparse-prediction-v1.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cortex-support-sparse-prediction-v1
          path: support-sparse-prediction-v1.jsonl
