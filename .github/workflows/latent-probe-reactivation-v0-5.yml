name: cortex-latent-probe-reactivation-v0.5

on:
  pull_request:
    paths:
      - "python/cortex/latent_probe_reactivation.py"
      - "python/cortex/probe_sampling.py"
      - "python/cortex/probe_economy.py"
      - "research/five_operator_bench/latent_reactivation.py"
      - "tests/test_latent_probe_reactivation.py"
      - "tests/test_latent_probe_reactivation_bench.py"
      - "docs/LATENT_PROBE_REACTIVATION_V0_5.md"
      - ".github/workflows/latent-probe-reactivation-v0-5.yml"
  workflow_dispatch:

jobs:
  latent-reactivation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=python:. pytest tests/test_latent_probe_reactivation.py tests/test_latent_probe_reactivation_bench.py tests/test_probe_sampling.py tests/test_probe_economy.py -q
      - run: PYTHONPATH=python:. python -m research.five_operator_bench.latent_reactivation
