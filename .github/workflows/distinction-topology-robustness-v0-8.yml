name: cortex-distinction-topology-robustness-v0.8

on:
  pull_request:
    paths:
      - "python/cortex/distinction_connectivity.py"
      - "python/cortex/learned_distinguishability.py"
      - "python/cortex/probe_economy.py"
      - "research/five_operator_bench/distinction_topology_robustness.py"
      - "tests/test_distinction_topology_robustness.py"
      - "docs/DISTINCTION_TOPOLOGY_ROBUSTNESS_V0_8.md"
      - "docs/DISTINCTION_TOPOLOGY_ROBUSTNESS_V0_8_RESULTS.md"
      - ".github/workflows/distinction-topology-robustness-v0-8.yml"
  workflow_dispatch:

jobs:
  distinction-topology-robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=python:. pytest tests/test_distinction_topology_robustness.py tests/test_distinction_connectivity.py -q
      - run: PYTHONPATH=python:. python -m research.five_operator_bench.distinction_topology_robustness
