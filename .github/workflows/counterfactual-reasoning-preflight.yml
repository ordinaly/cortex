name: cortex-counterfactual-reasoning-preflight

on:
  pull_request:
    paths:
      - "research/counterfactual_reasoning*.py"
      - "tests/test_counterfactual_reasoning.py"
      - "docs/COUNTERFACTUAL_REASONING_V1_PROTOCOL.md"
      - ".github/workflows/counterfactual-reasoning-preflight.yml"

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - name: Counterfactual reasoning preflight
        run: pytest tests/test_counterfactual_reasoning.py -q
