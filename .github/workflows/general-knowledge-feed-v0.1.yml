name: cortex-general-knowledge-feed-v0.1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "python/cortex/knowledge.py"
      - "python/cortex/topology.py"
      - "python/cortex/hypergraph_geometry.py"
      - "python/cortex/hypergraph_inference.py"
      - "python/cortex/wikidata.py"
      - "python/cortex/__init__.py"
      - "tests/test_knowledge.py"
      - "tests/test_topology.py"
      - "tests/test_hypergraph_geometry.py"
      - "tests/test_hypergraph_inference.py"
      - "tests/test_wikidata.py"
      - "benchmarks/benchmark_general_knowledge_feed.py"
      - "benchmarks/benchmark_relational_hypergeometry.py"
      - "benchmarks/benchmark_hypergraph_heldout_inference.py"
      - "scripts/prepare_wikidata_knowledge.py"
      - "docs/GENERAL_KNOWLEDGE_FEED_V0_1.md"
      - "docs/RELATIONAL_HYPERGEOMETRY_V0_1.md"
      - ".github/workflows/general-knowledge-feed-v0.1.yml"

jobs:
  general-knowledge-feed:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "maturin==1.15.0" pytest
      - run: python -m pip install -e .
      - name: Knowledge packet and Wikidata adapter tests
        run: pytest tests/test_knowledge.py tests/test_wikidata.py tests/test_topology.py tests/test_hypergraph_geometry.py tests/test_hypergraph_inference.py -q
      - name: Run general-knowledge-feed-v0.1
        run: >-
          python benchmarks/benchmark_general_knowledge_feed.py
          --output general-knowledge-feed-v0.1.json
      - name: Run relational-hypergeometry-v0.1
        run: >-
          python benchmarks/benchmark_relational_hypergeometry.py
          --output relational-hypergeometry-v0.1.json
      - name: Run hypergraph-heldout-inference-v0.1
        run: >-
          python benchmarks/benchmark_hypergraph_heldout_inference.py
          --seeds 50
          --output hypergraph-heldout-inference-v0.1.json
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-general-knowledge-feed-v0.1
          path: |
            general-knowledge-feed-v0.1.json
            relational-hypergeometry-v0.1.json
            hypergraph-heldout-inference-v0.1.json
