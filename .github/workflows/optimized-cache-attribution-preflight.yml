name: cortex-v1-17-optimized-cache-attribution-preflight

on:
  pull_request:
    paths:
      - "research/optimized_cache_refresh_attribution_campaign.py"
      - "research/optimized_cache_refresh_attribution_gate.py"
      - "tests/test_optimized_cache_refresh_attribution.py"
      - "docs/OPTIMIZED_CACHE_REFRESH_ATTRIBUTION_V1_17.md"
      - ".github/workflows/optimized-cache-attribution-preflight.yml"
  workflow_dispatch:

jobs:
  optimized-cache-attribution-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest numpy scipy
      - run: pytest tests/test_optimized_cache_refresh_attribution.py -q
      - name: Run development attribution campaign
        run: >-
          python research/optimized_cache_refresh_attribution_campaign.py
          --development
          --output optimized-cache-attribution-development.jsonl
      - name: Check development gates
        run: >-
          python research/optimized_cache_refresh_attribution_gate.py
          optimized-cache-attribution-development.jsonl
