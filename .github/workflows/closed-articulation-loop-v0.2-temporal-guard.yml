name: cortex-closed-articulation-loop-v0.2-temporal-guard

on:
  pull_request:
    paths:
      - "python/cortex/closed_articulation_loop.py"
      - "tests/test_closed_articulation_loop.py"
      - "research/closed_articulation_loop_temporal_guard_tuning.py"
      - "docs/CLOSED_ARTICULATION_LOOP_V0_2_TEMPORAL_GUARD.md"
      - ".github/workflows/closed-articulation-loop-v0.2-temporal-guard.yml"
  workflow_dispatch:

jobs:
  tune-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "maturin==1.15.0" pytest
      - run: python -m pip install -e .
      - run: >-
          pytest
          tests/test_closed_articulation_loop.py
          tests/test_regime_plasticity.py
          -q
      - name: Guard tuning and independent validation
        run: >-
          python research/closed_articulation_loop_temporal_guard_tuning.py
          --tuning-worlds 8
          --validation-worlds 20
          --output closed-loop-v0.2-temporal-guard.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closed-articulation-loop-v0.2-temporal-guard
          path: closed-loop-v0.2-temporal-guard.json
