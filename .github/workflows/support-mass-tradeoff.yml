name: cortex-support-mass-tradeoff

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/support_mass_tradeoff_campaign.py"
      - "research/support_mass_tradeoff_gate.py"
      - "tests/test_support_mass_tradeoff.py"
      - "docs/SUPPORT_MASS_TRADEOFF_V1.md"
      - ".github/workflows/support-mass-tradeoff.yml"

jobs:
  support-mass-tradeoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest
      - name: Support sweep smoke tests
        run: pytest tests/test_support_mass_tradeoff.py -q
      - name: Run retained-mass tradeoff campaign
        run: >-
          python research/support_mass_tradeoff_campaign.py
          --seeds 3
          --output support-mass-tradeoff-v1.jsonl
      - name: Validate campaign and report tradeoff
        run: >-
          python research/support_mass_tradeoff_gate.py
          support-mass-tradeoff-v1.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cortex-support-mass-tradeoff-v1
          path: support-mass-tradeoff-v1.jsonl
