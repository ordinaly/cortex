name: cortex-research-benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "VERSION"
      - "SPEC_VERSION"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "benchmarks/*.py"
      - "crates/cortex-articulation/**"
      - "crates/cortex-runtime/**"
      - "crates/cortex-python/src/lib.rs"
      - "crates/cortex-python/src/runtime.rs"
      - "python/cortex/__init__.py"
      - "scripts/check_version_consistency.py"
      - ".github/workflows/research-benchmarks.yml"

jobs:
  stabilization:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/check_version_consistency.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "maturin==1.15.0" numpy scipy
      - run: python -m pip install -e .
      - name: Run stabilization-v1
        run: >-
          python benchmarks/benchmark_stabilization.py
          --campaign
          --repetitions 3
          --output stabilization-v1.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-stabilization-v1
          path: stabilization-v1.jsonl

  characterization:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
