name: cortex-structural-analogy-v1-official

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/structural_analogy*.py"
      - "tests/test_structural_analogy.py"
      - "docs/STRUCTURAL_ANALOGY_V1_PROTOCOL.md"
      - ".github/workflows/structural-analogy-v1-official.yml"

jobs:
  official:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run frozen structural analogy v1 campaign
        run: >-
          python research/structural_analogy_campaign.py
          --output structural-analogy-v1.jsonl
      - name: Enforce frozen structural analogy v1 gates
        run: >-
          python research/structural_analogy_gate.py
          structural-analogy-v1.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cortex-structural-analogy-v1
          path: structural-analogy-v1.jsonl
