name: cortex-higher-order-irreducibility-v0.9

on:
  pull_request:
    paths:
      - "python/cortex/higher_order_irreducibility.py"
      - "python/cortex/distinction_connectivity.py"
      - "python/cortex/probe_economy.py"
      - "research/five_operator_bench/higher_order_irreducibility.py"
      - "tests/test_higher_order_irreducibility.py"
      - "tests/test_higher_order_irreducibility_bench.py"
      - "docs/HIGHER_ORDER_IRREDUCIBILITY_V0_9.md"
      - ".github/workflows/higher-order-irreducibility-v0-9.yml"
  workflow_dispatch:

jobs:
  higher-order-irreducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=python:. pytest tests/test_higher_order_irreducibility.py tests/test_higher_order_irreducibility_bench.py tests/test_distinction_connectivity.py -q
      - run: PYTHONPATH=python:. python -m research.five_operator_bench.higher_order_irreducibility
