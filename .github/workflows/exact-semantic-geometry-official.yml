name: cortex-v1-16-semantic-geometry-official

on:
  pull_request:
    paths:
      - ".github/workflows/exact-semantic-geometry-official.yml"

jobs:
  exact-semantic-geometry-official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip numpy scipy
      - name: Run untouched official campaign
        run: >-
          python research/exact_semantic_geometry_fast_path_campaign.py
          --official
          --output exact-semantic-geometry-official.jsonl
      - name: Check frozen official gates
        run: >-
          python research/exact_semantic_geometry_fast_path_gate.py
          exact-semantic-geometry-official.jsonl
          --official
          | tee exact-semantic-geometry-official-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: exact-semantic-geometry-official
          path: |
            exact-semantic-geometry-official.jsonl
            exact-semantic-geometry-official-gate.json
