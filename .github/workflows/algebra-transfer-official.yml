name: cortex-algebra-transfer-v1.5-official

on:
  pull_request:
    paths:
      - ".github/workflows/algebra-transfer-official.yml"

jobs:
  official:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - name: Run frozen algebra transfer v1.5 campaign
        run: >-
          python research/algebra_transfer_campaign.py
          --output algebra-transfer-v1.5.jsonl
      - name: Enforce frozen algebra transfer v1.5 gates
        run: >-
          python research/algebra_transfer_gate.py
          algebra-transfer-v1.5.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cortex-algebra-transfer-v1.5
          path: algebra-transfer-v1.5.jsonl
