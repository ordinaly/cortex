name: cortex-v1-18-kernel-ladder-repro

# v1.18-R is a concluded negative performance experiment. Keep the campaign
# available for reproducibility, but do not use its historical performance
# thresholds as a blocking check for newer cache implementations.
on:
  workflow_dispatch:

jobs:
  kernel-ladder-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest numpy scipy
      - run: pytest tests/test_kernel_ladder_fast_path.py -q
      - name: Run frozen development campaign
        run: >-
          python research/kernel_ladder_fast_path_campaign.py
          --development
          --output kernel-ladder-development.jsonl
      - name: Reproduce historical gates
        run: >-
          python research/kernel_ladder_fast_path_gate.py
          kernel-ladder-development.jsonl
