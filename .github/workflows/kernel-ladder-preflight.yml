name: cortex-v1-18-kernel-ladder-preflight

on:
  pull_request:
    paths:
      - "research/support_sparse_prediction.py"
      - "research/kernel_ladder_fast_path_campaign.py"
      - "research/kernel_ladder_fast_path_gate.py"
      - "tests/test_kernel_ladder_fast_path.py"
      - "docs/KERNEL_LADDER_FAST_PATH_V1_18.md"
      - ".github/workflows/kernel-ladder-preflight.yml"
  workflow_dispatch:

jobs:
  kernel-ladder-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest numpy scipy
      - run: pytest tests/test_kernel_ladder_fast_path.py -q
      - name: Run development campaign
        run: >-
          python research/kernel_ladder_fast_path_campaign.py
          --development
          --output kernel-ladder-development.jsonl
      - name: Check development validity gates
        run: >-
          python research/kernel_ladder_fast_path_gate.py
          kernel-ladder-development.jsonl
