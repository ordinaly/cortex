name: cortex-language-gateway-v0.1

on:
  pull_request:
    paths:
      - "python/cortex/language_gateway.py"
      - "python/cortex/gateway_server.py"
      - "python/cortex/strict_language_gateway.py"
      - "tests/test_language_gateway.py"
      - "tests/test_strict_language_gateway.py"
      - "docs/CORTEX_LANGUAGE_GATEWAY_V0_1.md"
      - "pyproject.toml"
      - ".github/workflows/language-gateway.yml"
      - ".github/workflows/ci.yml"

jobs:
  gateway:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest fastapi uvicorn
      - run: python -m py_compile python/cortex/language_gateway.py python/cortex/strict_language_gateway.py python/cortex/gateway_server.py
      - run: pytest tests/test_language_gateway.py tests/test_strict_language_gateway.py -q
      - name: Import HTTP app surface
        run: |
          python - <<'PY'
          from cortex.gateway_server import build_gateway_from_env, create_app
          gateway = build_gateway_from_env(chat_model="test", embedding_model="test")
          app = create_app(gateway)
          assert app.title == "Cortex Language Gateway"
          PY
