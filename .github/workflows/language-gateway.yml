name: cortex-language-gateway

on:
  pull_request:
    paths:
      - "python/cortex/language_gateway.py"
      - "python/cortex/gateway_server.py"
      - "python/cortex/strict_language_gateway.py"
      - "python/cortex/hybrid_language_gateway.py"
      - "tests/test_language_gateway.py"
      - "tests/test_strict_language_gateway.py"
      - "tests/test_hybrid_language_gateway.py"
      - "tests/test_gateway_http.py"
      - "docs/CORTEX_LANGUAGE_GATEWAY_V0_1.md"
      - "docs/CORTEX_LANGUAGE_GATEWAY_V0_2_STRICT_BOUNDARY.md"
      - "docs/CORTEX_LANGUAGE_GATEWAY_V0_3_HYBRID_COGNITION.md"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/language-gateway.yml"
      - ".github/workflows/ci.yml"

jobs:
  gateway:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest fastapi uvicorn httpx "openai==1.84.0" "ollama==0.6.1"
      - run: python -m py_compile python/cortex/language_gateway.py python/cortex/strict_language_gateway.py python/cortex/hybrid_language_gateway.py python/cortex/gateway_server.py
      - run: pytest tests/test_language_gateway.py tests/test_strict_language_gateway.py tests/test_hybrid_language_gateway.py tests/test_gateway_http.py -q
      - name: Import HTTP app surfaces
        run: |
          python - <<'PY'
          from cortex.gateway_server import build_gateway_from_env, create_app

          legacy = build_gateway_from_env(
              chat_model="test",
              embedding_model="test",
              persistence_dir="",
          )
          strict = build_gateway_from_env(
              chat_model="test",
              strict_neural_boundary=True,
              parser_model="test-parser",
              renderer_model="test-renderer",
              persistence_dir="",
          )
          hybrid = build_gateway_from_env(
              chat_model="test",
              hybrid_cognition=True,
              parser_model="test-parser",
              persistence_dir="",
          )

          assert create_app(legacy).title == "Cortex Language Gateway"
          assert create_app(strict).title == "Cortex Language Gateway"
          assert create_app(hybrid).title == "Cortex Language Gateway"
          assert strict.config.embedding_model == "sha256-symbolic-v1"
          assert hybrid.config.embedding_model == "sha256-symbolic-v1"
          PY
