name: normalize-rust-once

on:
  push:
    branches:
      - fix/ci-rust-migration

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-rust-migration
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Match frozen Python tie-breaking semantics
        run: python scripts/patch_ci_semantics.py
      - name: Normalize Rust and lock dependencies
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit deterministic normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "Fix differential tie-breaking and normalize Rust [skip ci]"
          git push origin HEAD:fix/ci-rust-migration
