name: cortex-ci

on:
  push:
  pull_request:

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_version_consistency.py

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Clippy (strict, with numerical-loop exceptions)
        run: >-
          cargo clippy
          -p cortex-core
          -p cortex-articulation
          -p cortex-graph
          -p cortex-memory
          -p cortex-runtime
          --all-targets --
          -D warnings
          -A clippy::needless_range_loop
          -A clippy::unnecessary_unwrap
      - run: cargo test -p cortex-core -p cortex-articulation -p cortex-graph -p cortex-memory -p cortex-runtime --release
      - run: cargo check -p cortex-python --release

  python-differential:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "maturin==1.15.0" pytest numpy scipy
      - run: python -m pip install -e .
        env:
          RUST_BACKTRACE: "1"
      - run: >-
          pytest
          tests/test_freeze.py
          tests/test_api.py
          tests/test_golden.py
          tests/test_native_layers.py
          tests/test_native_graph.py
          tests/test_native_runtime.py
          -q

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "maturin==1.15.0"
      - run: maturin build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-wheel
          path: target/wheels/*.whl
