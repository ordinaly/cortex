name: cortex-ci

on:
  push:
  pull_request:

jobs:
  markdown-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_markdown_integrity.py

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_version_consistency.py
      - run: python scripts/audit_repo.py

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Clippy (strict, with numerical-loop exceptions)
        run: >-
          cargo clippy
          -p cortex-core
          -p cortex-articulation
          -p cortex-graph
          -p cortex-memory
          -p cortex-runtime
          --all-targets --
          -D warnings
          -A clippy::needless_range_loop
          -A clippy::unnecessary_unwrap
      - run: cargo test -p cortex-core -p cortex-articulation -p cortex-graph -p cortex-memory -p cortex-runtime --release
      - run: cargo check -p cortex-python --release

  python-differential:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "maturin==1.15.0" pytest numpy scipy
      - run: python -m pip install -e .
        env:
          RUST_BACKTRACE: "1"
      - run: >-
          pytest
          tests/test_freeze.py
          tests/test_api.py
          tests/test_golden.py
          tests/test_native_layers.py
          tests/test_native_graph.py
          tests/test_native_runtime.py
          tests/test_autonomy.py
          tests/test_autonomy_campaign.py
          tests/test_lpu.py
          tests/test_lpu_validation.py
          tests/test_knowledge.py
          tests/test_wikidata.py
          tests/test_topology.py
          tests/test_hypergraph_geometry.py
          tests/test_hypergraph_inference.py
          tests/test_hypergraph_lpu.py
          tests/test_articulation_controller.py
          tests/test_controller_calibration.py
          tests/test_regime_plasticity.py
          tests/test_autonomy_robustness.py
          tests/test_autonomy_temporal_phase_b.py
          tests/test_closed_articulation_loop.py
          tests/test_semantic_grounding.py
          tests/test_semantic_revision.py
          tests/test_noisy_semantic_revision.py
          tests/test_latent_concept_induction.py
          tests/test_concept_semantic_integration.py
          tests/test_proof_dependency.py
          tests/test_planning_replanning.py
          tests/test_open_world_novelty.py
          tests/test_novelty_aware_replanning.py
          tests/test_open_world_robustness.py
          tests/test_open_world_robustness_b.py
          tests/test_open_world_robustness_c.py
          tests/test_open_world_robustness_d.py
          tests/test_open_world_robustness_a.py
          tests/test_cache_refresh_attribution.py
          tests/test_exact_semantic_geometry_fast_path.py
          tests/test_optimized_cache_reattribution.py
          tests/test_kernel_ladder_fast_path.py
          tests/test_low_overhead_stage_profile.py
          tests/test_lazy_distance_materialization.py
          tests/test_post_lazy_stage_profile.py
          tests/test_single_buffer_kernel_refresh.py
          tests/test_versioning.py
          -q

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "maturin==1.15.0"
      - run: maturin build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-wheel
          path: target/wheels/*.whl
