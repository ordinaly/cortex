name: latent-concept-induction-official

on:
  pull_request:
    paths:
      - ".github/workflows/latent-concept-induction-official.yml"

jobs:
  latent-concept-induction-official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip numpy
      - name: Run untouched official campaign
        run: >-
          python research/latent_concept_induction_campaign.py
          --official
          --output latent-concept-official.jsonl
      - name: Check frozen official gates
        run: >-
          python research/latent_concept_induction_gate.py
          --input latent-concept-official.jsonl
          --official
          | tee latent-concept-official-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: latent-concept-induction-official
          path: |
            latent-concept-official.jsonl
            latent-concept-official-summary.json
