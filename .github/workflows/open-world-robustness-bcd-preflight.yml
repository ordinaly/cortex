name: cortex-open-world-robustness-bcd-preflight

on:
  pull_request:
    paths:
      - "research/open_world_robustness_world.py"
      - "research/open_world_robustness_b_campaign.py"
      - "research/open_world_robustness_c_campaign.py"
      - "research/open_world_robustness_d_campaign.py"
      - "tests/test_open_world_robustness.py"
      - "tests/test_open_world_robustness_b.py"
      - "tests/test_open_world_robustness_c.py"
      - "tests/test_open_world_robustness_d.py"
      - ".github/workflows/open-world-robustness-bcd-preflight.yml"
  workflow_dispatch:

jobs:
  development-characterization:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "maturin==1.15.0" pytest
      - run: python -m pip install -e .
      - name: OWR B-C-D adapter tests
        run: >-
          pytest
          tests/test_open_world_robustness.py
          tests/test_open_world_robustness_b.py
          tests/test_open_world_robustness_c.py
          tests/test_open_world_robustness_d.py
          -q
      - name: OWR-B development characterization
        run: >-
          python research/open_world_robustness_b_campaign.py
          --worlds 12
          --output owr-b-development.json
      - name: OWR-C development characterization
        run: >-
          python research/open_world_robustness_c_campaign.py
          --worlds 12
          --output owr-c-development.json
      - name: OWR-D development characterization
        run: >-
          python research/open_world_robustness_d_campaign.py
          --worlds 1
          --capacities 512,2048,8192
          --output owr-d-development.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cortex-open-world-robustness-bcd-development
          path: |
            owr-b-development.json
            owr-c-development.json
            owr-d-development.json
