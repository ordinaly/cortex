name: cortex-fused-stage-attribution

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/fused_stage_attribution_campaign.py"
      - "research/fused_stage_attribution_gate.py"
      - "tests/test_fused_stage_attribution.py"
      - "docs/FUSED_STAGE_ATTRIBUTION_V1.md"
      - ".github/workflows/fused-stage-attribution.yml"

jobs:
  fused-stage-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest
      - name: Stage-attribution differential tests
        run: pytest tests/test_fused_stage_attribution.py -q
      - name: Run fused-stage attribution campaign
        run: >-
          python research/fused_stage_attribution_campaign.py
          --seeds 3
          --output fused-stage-attribution-v1.jsonl
      - name: Validate stage attribution
        run: >-
          python research/fused_stage_attribution_gate.py
          fused-stage-attribution-v1.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cortex-fused-stage-attribution-v1
          path: fused-stage-attribution-v1.jsonl
