name: cortex-learned-world-model

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/learned_world_model.py"
      - "tests/test_learned_world_model.py"
      - "docs/LEARNED_WORLD_MODEL_V1.md"
      - ".github/workflows/learned-world-model.yml"

jobs:
  learned-world-model:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "maturin==1.15.0" numpy pytest
      - run: python -m pip install -e .
      - run: pytest tests/test_learned_world_model.py -q
      - name: Run learned-world-model campaign
        run: >-
          python research/learned_world_model.py
          --base-seeds 12
          --sweep-seeds 5
          --output learned-world-model-v1.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-learned-world-model-v1
          path: learned-world-model-v1.jsonl
