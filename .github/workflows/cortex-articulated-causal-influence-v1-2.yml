name: cortex-articulated-causal-influence-v1.2

on:
  pull_request:
    paths:
      - "python/cortex/articulated_causal_influence.py"
      - "python/cortex/geometric_temporal_transport.py"
      - "python/cortex/simplicial_integration.py"
      - "research/five_operator_bench/articulated_causal_influence.py"
      - "tests/test_articulated_causal_influence.py"
      - "tests/test_articulated_causal_influence_bench.py"
      - "docs/ARTICULATED_CAUSAL_INFLUENCE_V1_2.md"
      - "docs/ARTICULATED_CAUSAL_INFLUENCE_V1_2_RESULTS.md"
      - ".github/workflows/cortex-articulated-causal-influence-v1-2.yml"
  workflow_dispatch:

jobs:
  articulated-causal-influence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=python:. pytest tests/test_articulated_causal_influence.py tests/test_articulated_causal_influence_bench.py tests/test_geometric_temporal_transport.py tests/test_simplicial_integration.py -q
      - run: PYTHONPATH=python:. python -m research.five_operator_bench.articulated_causal_influence
