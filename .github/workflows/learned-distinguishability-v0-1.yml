name: cortex-learned-distinguishability-v0.1

on:
  pull_request:
    paths:
      - "python/cortex/learned_distinguishability.py"
      - "python/cortex/trace_memory.py"
      - "python/cortex/five_operator_loop.py"
      - "research/five_operator_bench/**"
      - "research/sl_bench/**"
      - "tests/test_learned_distinguishability.py"
      - "tests/test_five_operator_bench.py"
      - "tests/test_sl_oracle.py"
      - "docs/LEARNED_DISTINGUISHABILITY_V0_1.md"
      - ".github/workflows/learned-distinguishability-v0-1.yml"
  workflow_dispatch:

jobs:
  learned-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: >-
          PYTHONPATH=python:.
          pytest
          tests/test_learned_distinguishability.py
          tests/test_five_operator_bench.py
          tests/test_five_operator_loop.py
          tests/test_sl_oracle.py
          -q
      - run: PYTHONPATH=python:. python -m research.five_operator_bench.learn_delta
