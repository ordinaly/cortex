name: benchmark-full-runtime-once

on:
  push:
    branches:
      - feature/native-full-runtime

jobs:
  benchmark:
    if: ${{ !contains(github.event.head_commit.message, '[benchmark-results]') }}
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "maturin==1.15.0" numpy scipy
      - run: python -m pip install -e .
      - name: Full-stack benchmark (3 independent processes per mode)
        run: |
          : > benchmark-results.txt
          for mode in python hybrid native; do
            for rep in 1 2 3; do
              echo "mode=${mode} repetition=${rep}" | tee -a benchmark-results.txt
              python benchmarks/benchmark_full_runtime.py --mode "${mode}" | tee -a benchmark-results.txt
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-full-runtime-benchmark
          path: benchmark-results.txt
