name: cortex-v1-19-low-overhead-stage-profile-official

on:
  pull_request:
    paths:
      - ".github/workflows/low-overhead-stage-profile-official.yml"

jobs:
  low-overhead-stage-profile-official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip numpy scipy
      - name: Run untouched official campaign
        run: >-
          python research/low_overhead_stage_profile_campaign.py
          --official
          --output low-overhead-stage-profile-official.jsonl
      - name: Check frozen official gates
        run: >-
          python research/low_overhead_stage_profile_gate.py
          low-overhead-stage-profile-official.jsonl
          --official
          | tee low-overhead-stage-profile-official-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: low-overhead-stage-profile-official
          path: |
            low-overhead-stage-profile-official.jsonl
            low-overhead-stage-profile-official-gate.json
