name: cortex-v1-20-lazy-distance-official

on:
  pull_request:
    paths:
      - ".github/workflows/lazy-distance-official.yml"

jobs:
  lazy-distance-official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip numpy scipy
      - name: Run untouched official campaign
        run: >-
          python research/lazy_distance_materialization_campaign.py
          --official
          --output lazy-distance-official.jsonl
      - name: Check frozen official gates
        run: >-
          python research/lazy_distance_materialization_gate.py
          lazy-distance-official.jsonl
          --official
          | tee lazy-distance-official-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: lazy-distance-official
          path: |
            lazy-distance-official.jsonl
            lazy-distance-official-gate.json
