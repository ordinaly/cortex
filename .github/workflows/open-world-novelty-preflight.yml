name: cortex-open-world-novelty-attribution-v1

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/open_world_novelty*.py"
      - "tests/test_open_world_novelty.py"
      - "docs/OPEN_WORLD_NOVELTY_ATTRIBUTION_V1_PROTOCOL.md"
      - ".github/workflows/open-world-novelty-preflight.yml"

jobs:
  development:
    if: github.event.action != 'ready_for_review'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest tests/test_open_world_novelty.py -q
      - name: Run frozen development campaign
        run: >-
          python research/open_world_novelty_campaign.py
          --development
          --output open-world-novelty-development.jsonl
      - name: Apply frozen development gates
        run: >-
          python research/open_world_novelty_gate.py
          open-world-novelty-development.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-world-novelty-development
          path: open-world-novelty-development.jsonl
          if-no-files-found: ignore

  official:
    if: github.event.action == 'ready_for_review'
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest tests/test_open_world_novelty.py -q
      - name: Run untouched official campaign
        run: >-
          python research/open_world_novelty_campaign.py
          --official
          --output open-world-novelty-official.jsonl
      - name: Apply frozen official gates
        run: >-
          python research/open_world_novelty_gate.py
          open-world-novelty-official.jsonl
          --official
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-world-novelty-official
          path: open-world-novelty-official.jsonl
          if-no-files-found: ignore
