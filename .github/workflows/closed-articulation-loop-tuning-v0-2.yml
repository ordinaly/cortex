name: cortex-closed-articulation-loop-tuning-v0.2

on:
  pull_request:
    paths:
      - "python/cortex/closed_articulation_loop.py"
      - "python/cortex/regime_plasticity.py"
      - "research/closed_articulation_loop_campaign.py"
      - "research/closed_articulation_loop_tuning.py"
      - "docs/CLOSED_ARTICULATION_LOOP_TUNING_V0_2.md"
      - ".github/workflows/closed-articulation-loop-tuning-v0-2.yml"
  workflow_dispatch:

jobs:
  tune-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "maturin==1.15.0"
      - run: python -m pip install -e .
      - name: Factorized development tuning and holdout
        run: >-
          python research/closed_articulation_loop_tuning.py
          --tuning-worlds 4
          --validation-worlds 12
          --output closed-loop-v0.2-tuning.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closed-articulation-loop-v0.2-tuning
          path: closed-loop-v0.2-tuning.json
