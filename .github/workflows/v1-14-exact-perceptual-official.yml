name: cortex-v1-14-exact-perceptual-official

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "research/fuzzy_predictive_field.py"
      - "research/exact_perceptual_fast_path*.py"
      - "tests/test_exact_perceptual_fast_path.py"
      - "docs/EXACT_PERCEPTUAL_FAST_PATH_V1_14.md"
      - ".github/workflows/v1-14-exact-perceptual-official.yml"

jobs:
  official:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy scipy
      - name: Run frozen v1.14-R exact fast-path campaign
        run: >-
          python research/exact_perceptual_fast_path_campaign.py
          --seeds 3
          --output exact-perceptual-fast-path-v1.14-R.jsonl
      - name: Enforce frozen v1.14-R gates
        run: >-
          python research/exact_perceptual_fast_path_gate.py
          exact-perceptual-fast-path-v1.14-R.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cortex-exact-perceptual-fast-path-v1-14-R
          path: exact-perceptual-fast-path-v1.14-R.jsonl
