name: cortex-simplicial-integration-v1.0

on:
  pull_request:
    paths:
      - "python/cortex/simplicial_integration.py"
      - "python/cortex/higher_order_irreducibility.py"
      - "python/cortex/distinction_connectivity.py"
      - "python/cortex/probe_economy.py"
      - "research/five_operator_bench/simplicial_integration.py"
      - "research/five_operator_bench/higher_order_irreducibility.py"
      - "tests/test_simplicial_integration.py"
      - "tests/test_simplicial_integration_bench.py"
      - ".github/workflows/cortex-simplicial-integration-v1-0.yml"
  workflow_dispatch:

jobs:
  simplicial-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=python:. pytest tests/test_simplicial_integration.py tests/test_simplicial_integration_bench.py tests/test_higher_order_irreducibility.py tests/test_distinction_connectivity.py -q
      - run: PYTHONPATH=python:. python -m research.five_operator_bench.simplicial_integration
