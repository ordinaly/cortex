name: format-perf-summary-once

on:
  push:
    branches:
      - perf/lightweight-graph-summary

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/lightweight-graph-summary
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/cortex-graph/src/lib.rs crates/cortex-runtime/src/lib.rs
          git commit -m "Apply canonical Rust formatting"
          git push origin HEAD:perf/lightweight-graph-summary
