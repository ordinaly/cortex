name: cortex-v1-17-optimized-cache-reattribution-official

on:
  pull_request:
    paths:
      - ".github/workflows/optimized-cache-reattribution-official.yml"

jobs:
  optimized-cache-reattribution-official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip numpy scipy
      - name: Run untouched official attribution campaign
        run: >-
          python research/optimized_cache_reattribution_campaign.py
          --official
          --output optimized-cache-reattribution-official.jsonl
      - name: Check frozen official gates
        run: >-
          python research/optimized_cache_reattribution_gate.py
          optimized-cache-reattribution-official.jsonl
          --official
          | tee optimized-cache-reattribution-official-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: optimized-cache-reattribution-official
          path: |
            optimized-cache-reattribution-official.jsonl
            optimized-cache-reattribution-official-gate.json
