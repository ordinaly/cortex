name: cortex-v1-22-single-buffer-kernel-refresh-repro

# v1.22-R was rejected at development stage. Keep the exactness test and
# frozen development campaign available for manual reproduction. The official
# seeds were never run and remain intentionally untouched.
on:
  workflow_dispatch:

jobs:
  single-buffer-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest numpy scipy
      - run: pytest tests/test_single_buffer_kernel_refresh.py -q
      - name: Reproduce frozen development campaign
        run: >-
          python research/single_buffer_kernel_refresh_campaign.py
          --development
          --output single-buffer-development.jsonl
      - name: Reproduce historical gates
        continue-on-error: true
        run: >-
          python research/single_buffer_kernel_refresh_gate.py
          single-buffer-development.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-22-single-buffer-development
          path: single-buffer-development.jsonl
          if-no-files-found: ignore
