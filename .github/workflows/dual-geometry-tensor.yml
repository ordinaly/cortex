name: cortex-dual-geometry-tensor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/dual_geometry_tensor.py"
      - "tests/test_dual_geometry_tensor.py"
      - "docs/DUAL_GEOMETRY_TENSOR_BRIDGE.md"
      - ".github/workflows/dual-geometry-tensor.yml"

jobs:
  dual-geometry-tensor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest
      - run: pytest tests/test_dual_geometry_tensor.py -q
