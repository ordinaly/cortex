name: cortex-v1-16-semantic-geometry-repro

# v1.16-R is a concluded historical optimization campaign. Keep it available
# for reproducibility, but do not use its old bottleneck-share performance gate
# as a blocking check for newer research-cache implementations.
on:
  workflow_dispatch:

jobs:
  exact-semantic-geometry-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest numpy scipy
      - run: pytest tests/test_exact_semantic_geometry_fast_path.py -q
      - name: Run frozen development campaign
        run: >-
          python research/exact_semantic_geometry_fast_path_campaign.py
          --development
          --output exact-semantic-geometry-development.jsonl
      - name: Reproduce historical gates
        run: >-
          python research/exact_semantic_geometry_fast_path_gate.py
          exact-semantic-geometry-development.jsonl
