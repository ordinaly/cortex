name: cortex-v1-16-semantic-geometry-preflight

on:
  pull_request:
    paths:
      - "research/support_sparse_prediction.py"
      - "research/exact_semantic_geometry_fast_path_campaign.py"
      - "research/exact_semantic_geometry_fast_path_gate.py"
      - "tests/test_exact_semantic_geometry_fast_path.py"
      - "docs/EXACT_SEMANTIC_GEOMETRY_FAST_PATH_V1_16.md"
      - ".github/workflows/exact-semantic-geometry-preflight.yml"
  workflow_dispatch:

jobs:
  exact-semantic-geometry-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest numpy scipy
      - run: pytest tests/test_exact_semantic_geometry_fast_path.py -q
      - name: Run development campaign
        run: >-
          python research/exact_semantic_geometry_fast_path_campaign.py
          --development
          --output exact-semantic-geometry-development.jsonl
      - name: Check development validity gates
        run: >-
          python research/exact_semantic_geometry_fast_path_gate.py
          exact-semantic-geometry-development.jsonl
