name: cortex-five-operator-articulation-v0.1

on:
  pull_request:
    paths:
      - "python/cortex/five_operator_loop.py"
      - "tests/test_five_operator_loop.py"
      - "docs/FIVE_OPERATOR_ARTICULATION_V0_1.md"
      - ".github/workflows/five-operator-articulation-v0-1.yml"
  workflow_dispatch:

jobs:
  operator-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=python pytest tests/test_five_operator_loop.py -q
