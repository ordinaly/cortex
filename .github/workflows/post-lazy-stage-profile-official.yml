name: cortex-v1-21-post-lazy-stage-profile-official

on:
  pull_request:
    paths:
      - ".github/workflows/post-lazy-stage-profile-official.yml"

jobs:
  post-lazy-stage-profile-official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip numpy scipy
      - name: Run untouched official campaign
        run: >-
          python research/post_lazy_stage_profile_campaign.py
          --official
          --output post-lazy-stage-profile-official.jsonl
      - name: Check frozen official gates
        run: >-
          python research/post_lazy_stage_profile_gate.py
          post-lazy-stage-profile-official.jsonl
          --official
          | tee post-lazy-stage-profile-official-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: post-lazy-stage-profile-official
          path: |
            post-lazy-stage-profile-official.jsonl
            post-lazy-stage-profile-official-gate.json
