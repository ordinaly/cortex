name: patch-native-lints-once

on:
  push:
    branches:
      - feature/native-articulation-memory

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[native-lints]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/native-articulation-memory
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/patch_native_lints.py
      - run: cargo fmt --all
      - name: Commit lint-safe semantics-preserving cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git diff --cached --quiet && exit 0
          git commit -m "Resolve native migration lint findings [native-lints]"
          git push origin HEAD:feature/native-articulation-memory
