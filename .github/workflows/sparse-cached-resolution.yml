name: cortex-sparse-cached-resolution

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/sparse_cached_resolution.py"
      - "research/sparse_cached_resolution_campaign.py"
      - "research/sparse_cached_resolution_gate.py"
      - "tests/test_sparse_cached_resolution.py"
      - "docs/SPARSE_CACHED_RESOLUTION_V1.md"
      - ".github/workflows/sparse-cached-resolution.yml"

jobs:
  sparse-cached-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest
      - name: Unit and differential tests
        run: pytest tests/test_sparse_cached_resolution.py -q
      - name: Run optimization campaign
        run: >-
          python research/sparse_cached_resolution_campaign.py
          --seeds 5
          --output sparse-cached-resolution-v1.jsonl
      - name: Enforce optimization gates
        run: >-
          python research/sparse_cached_resolution_gate.py
          sparse-cached-resolution-v1.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cortex-sparse-cached-resolution-v1
          path: sparse-cached-resolution-v1.jsonl
