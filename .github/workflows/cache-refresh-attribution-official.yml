name: cortex-v1-15-cache-refresh-attribution-official

on:
  pull_request:
    paths:
      - ".github/workflows/cache-refresh-attribution-official.yml"

jobs:
  cache-refresh-attribution-official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip numpy scipy
      - name: Run untouched official attribution campaign
        run: >-
          python research/cache_refresh_attribution_campaign.py
          --official
          --output cache-refresh-attribution-official.jsonl
      - name: Check frozen official gates
        run: >-
          python research/cache_refresh_attribution_gate.py
          cache-refresh-attribution-official.jsonl
          --official
          | tee cache-refresh-attribution-official-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: cache-refresh-attribution-official
          path: |
            cache-refresh-attribution-official.jsonl
            cache-refresh-attribution-official-gate.json
