name: semantic-grounding-official

on:
  push:
    branches:
      - "research/hybrid-semantic-grounding-v1"
    paths:
      - ".github/workflows/semantic-grounding-official.yml"

jobs:
  semantic-grounding-official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run untouched official campaign
        run: >-
          python research/semantic_grounding_campaign.py
          --official
          --output semantic-grounding-official.jsonl
      - name: Check frozen official gates
        run: >-
          python research/semantic_grounding_gate.py
          --input semantic-grounding-official.jsonl
          --official
          | tee semantic-grounding-official-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-grounding-official
          path: |
            semantic-grounding-official.jsonl
            semantic-grounding-official-summary.json
