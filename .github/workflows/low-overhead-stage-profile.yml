name: cortex-v1-19-low-overhead-stage-profile

on:
  pull_request:
    paths:
      - "research/low_overhead_stage_profile_campaign.py"
      - "research/low_overhead_stage_profile_gate.py"
      - "tests/test_low_overhead_stage_profile.py"
      - "docs/LOW_OVERHEAD_STAGE_PROFILE_V1_19.md"
      - ".github/workflows/low-overhead-stage-profile.yml"
  workflow_dispatch:

jobs:
  low-overhead-stage-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest numpy scipy
      - run: pytest tests/test_low_overhead_stage_profile.py -q
      - name: Run development campaign
        run: >-
          python research/low_overhead_stage_profile_campaign.py
          --development
          --output low-overhead-stage-profile-development.jsonl
      - name: Check development gates
        run: >-
          python research/low_overhead_stage_profile_gate.py
          low-overhead-stage-profile-development.jsonl
