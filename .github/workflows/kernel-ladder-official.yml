name: cortex-v1-18-kernel-ladder-official

on:
  pull_request:
    paths:
      - ".github/workflows/kernel-ladder-official.yml"

jobs:
  kernel-ladder-official:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip numpy scipy
      - name: Run untouched official campaign
        run: >-
          python research/kernel_ladder_fast_path_campaign.py
          --official
          --output kernel-ladder-official.jsonl
      - name: Check frozen official gates
        run: >-
          python research/kernel_ladder_fast_path_gate.py
          kernel-ladder-official.jsonl
          --official
          | tee kernel-ladder-official-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-ladder-official
          path: |
            kernel-ladder-official.jsonl
            kernel-ladder-official-gate.json
